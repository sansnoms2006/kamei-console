<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamei Productions Game Console</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="favIcon" type="image/png" href="icons/default-192.png">
<link rel="apple-touch-icon" id="appleIcon" href="icons/default-180.png">
<meta name="theme-color" content="#0b0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kamei Console">
<script>
  /* Web version: the service worker unlocks PSP / DOS (threads). Not used inside the Android app. */
  window.KAMEI_WEB = !window.KameiNative;
  if (window.KAMEI_WEB && "serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
      if (!window.crossOriginIsolated && !sessionStorage.getItem("kamei-coi")) { sessionStorage.setItem("kamei-coi", "1"); location.reload(); }
    }).catch(() => {});
  }
</script>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root { --bg: #0b0b12; --panel: #15151f; --line: #26263a; --text: #f1f1f7; --muted: #8b8ba7; --theme: #8fc63f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif; }
  body { background: radial-gradient(130% 60% at 50% -10%, color-mix(in srgb, var(--theme) 22%, transparent), transparent 70%) var(--bg) no-repeat;
         padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 100px); min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 1100px; margin: 0 auto 18px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark { width: 44px; height: 44px; flex: none; object-fit: cover; object-position: top; border-radius: 50%;
          background: color-mix(in srgb, var(--theme) 25%, #15151f); border: 2px solid var(--theme); transition: border-color .4s; }
  .logo { font-family: "Press Start 2P", monospace; font-size: 12px; letter-spacing: 1px; line-height: 1.6; white-space: nowrap; }
  .logo span { color: var(--theme); }
  .logo small { display: block; font-size: 8px; color: var(--muted); letter-spacing: 3px; margin-top: 2px; }
  .lang { flex: none; font-weight: 800; font-size: 12px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }

  .hbtns { display: flex; gap: 8px; align-items: center; flex: none; }
  .acc { padding: 0; border-radius: 50%; }
  .av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--ac); color: #0b0b12; font-weight: 800; flex: none; }
  .colors { display: flex; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
  .colors button { width: 34px; height: 34px; border-radius: 50%; background: var(--ac); border: 3px solid transparent; }
  .colors button.on { border-color: #fff; }
  .hint.err { color: #ff6b81; min-height: 1em; }
  .acc-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .acc-head h3 { margin: 0 0 2px; }
  .code { color: var(--text); letter-spacing: 1px; }
  .mini { margin-left: 6px; padding: 4px 8px; border-radius: 8px; background: #2a2a3d; font-size: 12px; font-weight: 700; }
  .addf { display: flex; gap: 8px; } .addf input { flex: 1; } .addf button { width: 48px; height: 46px; border-radius: 10px; background: var(--theme); color: #0b0b12; font-weight: 800; font-size: 20px; }
  .friend, .sess { position: relative; display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px; border-radius: 14px; background: #1b1b28; margin-bottom: 8px; }
  .friend .dot { position: absolute; left: 42px; top: 40px; width: 12px; height: 12px; border-radius: 50%; background: #55556e; border: 2px solid #1b1b28; }
  .friend .dot.on { background: #4ade80; }
  .fi { flex: 1; min-width: 0; } .fi b { display: block; font-size: 14px; } .fi span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fi span.playing { color: #4ade80; }
  .friend img, .sess img { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .sess .ph { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 8px; background: #0b0b12; font-size: 10px; font-weight: 800; color: var(--muted); }
  .btns .danger { color: #ff6b81; }
  .badge { display: inline-block; vertical-align: middle; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--theme); color: #0b0b12; margin-left: 4px; }
  .badge.ban { background: #ff6b81; }
  .fi span.badge, .fi .badge { display: inline-block; width: auto; color: #0b0b12; margin: 2px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 14px; }
  .stats div { background: #1b1b28; border-radius: 12px; padding: 10px; text-align: center; }
  .stats b { display: block; font-size: 18px; } .stats span { color: var(--muted); font-size: 11px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  /* ---- swipeable console deck ---- */
  .deck { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 8px;
          scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .deck::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 84%; max-width: 520px; height: min(62vh, 470px); min-height: 360px; scroll-snap-align: center; border-radius: 26px; overflow: hidden;
           background: radial-gradient(120% 70% at 70% 100%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%),
                       linear-gradient(170deg, color-mix(in srgb, var(--c) 30%, #1a1024), #0e0a16 80%);
           border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); transition: transform .3s, opacity .3s; transform: scale(.94); opacity: .6; }
  .slide.on { transform: none; opacity: 1; }
  .slide .txt { position: absolute; left: 20px; right: 20px; top: 18px; z-index: 2; }
  .slide .kicker { font-family: "Press Start 2P", monospace; font-size: 9px; letter-spacing: 1px; color: var(--c); }
  .slide h2 { margin: 8px 0 4px; font-size: 30px; line-height: 1.05; font-weight: 800; }
  .slide p { margin: 0; color: var(--muted); font-size: 13px; }
  .slide .count { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.4); color: var(--text); font-weight: 700; font-size: 12px; }
  .slide .scene { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 76%; }
  .slide.on .scene { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: none; } 50% { transform: translateY(-5px); } }
  .slide .pk { position: absolute; width: 58px; bottom: 10px; left: 12px; z-index: 1; filter: drop-shadow(0 0 14px rgba(255,140,30,.55)); animation: flicker 2.6s infinite; }
  .slide .pk.r { left: auto; right: 12px; width: 42px; animation-delay: 1.1s; }
  @keyframes flicker { 0%, 100% { filter: drop-shadow(0 0 14px rgba(255,140,30,.55)); } 45% { filter: drop-shadow(0 0 22px rgba(255,170,40,.8)); } 55% { filter: drop-shadow(0 0 8px rgba(255,120,20,.4)); } }
  .dots { display: flex; justify-content: center; gap: 3px; padding: 8px 6px 2px; flex-wrap: nowrap; overflow: hidden; }
  .dots i { flex: 0 0 5px; height: 5px; border-radius: 3px; background: #3a3050; transition: flex-basis .25s, background .25s; }
  .dots i.on { flex-basis: 16px; background: var(--theme); }
  .swipe-hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .hero { display: flex; align-items: flex-end; gap: 8px; border-radius: 22px; overflow: hidden;
          background: linear-gradient(160deg, color-mix(in srgb, var(--theme) 38%, #15151f), #12121b 75%);
          border: 1px solid color-mix(in srgb, var(--theme) 40%, var(--line)); min-height: 210px; transition: background .4s, border-color .4s; }
  .hero .txt { flex: 1; padding: 20px 0 22px 20px; align-self: center; min-width: 0; }
  .hero .kicker { font-family: "Press Start 2P", monospace; font-size: 9px; letter-spacing: 1px; color: var(--theme); }
  .hero h2 { margin: 8px 0 6px; font-size: 22px; line-height: 1.15; font-weight: 800; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .hero .scene { flex: none; width: 52%; max-width: 260px; display: block; animation: bob 3.2s ease-in-out infinite; }
  .hero.swap .scene { animation: pop .45s cubic-bezier(.2,1.4,.4,1), bob 3.2s ease-in-out .45s infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes pop { from { transform: translateY(30px) scale(.9); opacity: 0; } }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 13px; }
  .tab.has { color: var(--text); }
  .tab.on { background: var(--theme); color: #0b0b12; border-color: var(--theme); }
  .tabs { padding-top: 8px; }

  .search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
            color: var(--text); font: inherit; outline: none; margin-bottom: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { position: relative; text-align: left; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
          overflow: hidden; display: flex; flex-direction: column; transition: transform .12s; }
  .card:active { transform: scale(.97); }
  .cart { aspect-ratio: 1 / 1; position: relative; display: grid; place-items: center; padding: 14px; width: 100%;
          background: radial-gradient(120% 90% at 30% 10%, color-mix(in srgb, var(--c) 55%, #000) 0%, #101018 75%); }
  .cart .label { width: 78%; aspect-ratio: 1 / 1.05; border-radius: 6px 6px 14px 6px; background: var(--c);
                 box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.45);
                 display: grid; place-items: center; padding: 10px; color: #111; text-align: center;
                 font-family: "Press Start 2P", monospace; font-size: 9px; line-height: 1.6; word-break: break-word; overflow: hidden; }
  .cart img.cover { position: absolute; inset: 6%; width: 88%; height: 88%; object-fit: contain; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
  .cart:has(img.cover) .label { visibility: hidden; }
  .cart .sys { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; letter-spacing: .5px; z-index: 1;
               padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; }
  .meta { padding: 10px 12px 12px; }
  .title { font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 10px; background: rgba(0,0,0,.55);
          color: #fff; font-size: 18px; line-height: 1; display: grid; place-items: center; z-index: 1; }

  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty .big { font-family: "Press Start 2P", monospace; color: var(--text); font-size: 13px; line-height: 1.8; margin-bottom: 14px; }
  .empty p { max-width: 380px; margin: 8px auto; }

  .fab { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 5; transition: background .4s;
         background: var(--theme); color: #0b0b12; font-weight: 800; padding: 15px 22px; border-radius: 16px;
         box-shadow: 0 10px 30px color-mix(in srgb, var(--theme) 40%, transparent); }
  .hidden-input { display: none; }
  .foot { max-width: 1100px; margin: 40px auto 0; color: #55556e; font-size: 11px; text-align: center; }
  .foot a { color: inherit; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 88px); transform: translate(-50%, 14px) scale(.96);
           background: linear-gradient(135deg, #24243c, #191926); padding: 11px 18px 11px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; z-index: 70; opacity: 0;
           transition: opacity .22s, transform .28s cubic-bezier(.2,1.4,.4,1); pointer-events: none; max-width: 88vw; text-align: left;
           border: 1.5px solid color-mix(in srgb, var(--tacc, #8fc63f) 55%, transparent); box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 18px color-mix(in srgb, var(--tacc, #8fc63f) 25%, transparent);
           display: flex; align-items: center; gap: 10px; }
  .toast::before { content: ""; flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--tacc, #8fc63f) var(--khead) center 18% / 150% auto no-repeat; border: 2px solid var(--tacc, #8fc63f); }
  .toast:empty { display: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  /* in-app notification card (chat, trades, friends, updates) */
  .knotif { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px); z-index: 90; display: flex; gap: 12px; align-items: center;
            padding: 12px 14px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--tacc, #8fc63f) 22%, #1b1b2b), #15151f 70%);
            border: 1.5px solid color-mix(in srgb, var(--tacc, #8fc63f) 60%, transparent); box-shadow: 0 14px 40px rgba(0,0,0,.55), 0 0 24px color-mix(in srgb, var(--tacc, #8fc63f) 30%, transparent);
            transform: translateY(-140%); transition: transform .45s cubic-bezier(.2,1.3,.4,1), opacity .3s; opacity: 0; touch-action: pan-x; }
  .knotif.on { transform: none; opacity: 1; }
  .knotif .kav { flex: 0 0 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--tacc, #8fc63f); background: var(--tacc, #8fc63f) var(--khead) center 16% / 150% auto no-repeat; position: relative; }
  .knotif .kav i { position: absolute; right: -6px; bottom: -6px; font-style: normal; font-size: 18px; }
  .knotif .kt { flex: 1; min-width: 0; }
  .knotif .kt b { display: block; font-family: var(--tfont, Inter), Inter, sans-serif; font-size: 17px; font-weight: 400; color: var(--tacc, #8fc63f); letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body:not(.themed) .knotif .kt b { font-weight: 800; font-size: 15px; }
  .knotif .kt span { display: block; font-size: 14px; color: #e8e8f2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .knotif .kx { flex: 0 0 auto; color: var(--muted); font-size: 18px; padding: 4px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 60; display: none; align-items: flex-end; justify-content: center; }
  .sheet-bg.on { display: flex; }
  .sheet { width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; background: var(--panel); border-radius: 20px 20px 0 0;
           padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); border: 1px solid var(--line); }
  .sheet h3, .view h3 { margin: 0 0 4px; font-size: 16px; }
  .sheet .hint, .view .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .sheet .row, .view .row { display: block; width: 100%; text-align: left; padding: 14px; border-radius: 12px; font-weight: 600; }
  .sheet .row:active, .view .row:active { background: #1e1e2c; }
  .sheet .row.on, .view .row.on { color: var(--theme); }
  .sheet .danger, .view .danger { color: #ff6b81; }
  .sheet input, .view input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; margin-bottom: 12px; }
  .sheet .btns, .view .btns { display: flex; gap: 10px; }
  .sheet .btns button, .view .btns button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; background: #23233a; }
  .sheet .btns .ok, .view .btns .ok { background: var(--theme); color: #0b0b12; }
  .covgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .covgrid button { display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 10px; background: #1b1b28; text-align: left; }
  .covgrid img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .covgrid span { font-size: 10px; color: var(--muted); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .covgrid .hint { grid-column: 1 / -1; }
  /* ---- welcome screen (account required) ---- */
  body.gated { overflow: hidden; }
  #gate { position: fixed; inset: 0; z-index: 90; overflow-y: auto; background: var(--tbg, radial-gradient(120% 50% at 50% 0%, rgba(143,198,63,.18), transparent 65%) #0b0b12);
          padding: calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 30px); }
  #gate .gwrap { max-width: 420px; margin: 0 auto; text-align: center; }
  #gate .glang { display: flex; justify-content: flex-end; gap: 6px; }
  #gate .glang button { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); font-weight: 800; font-size: 12px; }
  #gate .glang button.on { color: var(--text); border-color: var(--text); }
  #gate .gart { width: 150px; height: 230px; display: block; margin: 4px auto 6px; animation: bob 3.2s ease-in-out infinite; }
  #gate .logo { font-size: 13px; }
  #gate h2 { font-size: 24px; margin: 18px 0 6px; }
  #gate .gtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #15151f; padding: 5px; border-radius: 14px; margin: 16px 0 14px; }
  #gate .gtabs button { padding: 11px; border-radius: 10px; font-weight: 800; color: var(--muted); }
  #gate .gtabs button.on { background: var(--tacc, #8fc63f); color: #0b0b12; }
  #gate #gateForm { text-align: left; }
  #gate input { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: #0b0b12; color: var(--text); font: inherit; margin-bottom: 12px; }
  #gate .btns button.ok { width: 100%; padding: 15px; border-radius: 14px; font-weight: 800; font-size: 16px; background: var(--tacc, #8fc63f); color: #0b0b12; }
  /* ---- trades ---- */
  .sheet h4, .view h4 { margin: 16px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .ok-row { background: color-mix(in srgb, var(--theme) 22%, transparent); color: var(--text); text-align: center !important; }
  .mon { display: inline-flex; align-items: center; gap: 8px; vertical-align: middle; }
  .mon img { width: 48px; height: 48px; image-rendering: pixelated; }
  .mon b { font-size: 14px; } .mon small { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .trade { background: #1b1b28; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .trade .tline { font-weight: 700; margin-bottom: 4px; }
  .trade .btns { margin-top: 8px; }
  .trade.small { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .trade .arrow { color: var(--muted); font-weight: 700; }
  .trade .st { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); }
  .trade .st.accepted { color: #4ade80; } .trade .st.declined, .trade .st.cancelled { color: #ff6b81; }
  .mongrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 50vh; overflow-y: auto; margin-bottom: 12px; }
  .mongrid button { background: #1b1b28; border-radius: 12px; padding: 6px; text-align: left; }
  .mongrid .mon { flex-wrap: wrap; } .mongrid .mon small { display: block; margin: 0; width: 100%; }
  .acc.dot { position: relative; } .acc.dot::after { content: ""; position: absolute; top: 0; right: 0; width: 11px; height: 11px; border-radius: 50%; background: #ff4757; border: 2px solid var(--bg); }
  .catitem { display: flex; gap: 12px; align-items: center; background: #1b1b28; border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .catitem .cimg { position: relative; width: 62px; height: 62px; flex: none; border-radius: 10px; display: grid; place-items: center; overflow: hidden;
                   background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--c) 60%, #000), #101018); }
  .catitem .cimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .catitem .cimg span { font-size: 10px; font-weight: 800; color: #fff; }
  .catitem .cinfo { flex: 1; min-width: 0; } .catitem .cinfo b { display: block; font-size: 14px; }
  .catitem .cinfo small { display: block; color: var(--muted); font-size: 12px; } .catitem .cinfo a { font-size: 12px; color: var(--theme); }
  .catitem .cact { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .catitem .cact .ok { background: var(--theme); color: #0b0b12; font-weight: 800; padding: 8px 12px; border-radius: 10px; }
  .catitem .done { color: #4ade80; font-size: 12px; font-weight: 700; }
  .slot { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: #1b1b28; margin-bottom: 10px; }
  .slot .thumb { width: 84px; height: 63px; flex: none; border-radius: 8px; background: #0b0b12 center/contain no-repeat; display: grid; place-items: center; color: #44445a; font-size: 20px; }
  .slot .info { flex: 1; min-width: 0; }
  .slot .info b { display: block; font-size: 14px; }
  .slot .info span { color: var(--muted); font-size: 12px; }
  .slot .acts { display: flex; flex-direction: column; gap: 6px; }
  .slot .acts button { padding: 7px 12px; border-radius: 9px; font-weight: 700; font-size: 12px; background: #2a2a3d; }
  .slot .acts .ok { background: var(--theme); color: #0b0b12; }
  .slot .acts button:disabled { opacity: .35; }

  #player { position: fixed; inset: 0; z-index: 40; background: #0b0b12; display: none; flex-direction: column; }
  #player.on { display: flex; }
  .pbar { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 6px) 10px 6px; }
  .pbar .now { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .pbar button { background: #23233a; color: #fff; font-weight: 700; font-size: 13px; padding: 8px 12px; border-radius: 10px; flex: none; }
  #player iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>

let dbPromise = null;
function db() {
  if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open("retro-pocket", 1); } catch (e) { return reject(e); }
    req.onupgradeneeded = () => req.result.createObjectStore("games", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const tr = d.transaction("games", mode);
    const out = fn(tr.objectStore("games"));
    tr.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
    tr.onerror = () => reject(tr.error);
    tr.onabort = () => reject(tr.error);
  });
}
const getAll = () => tx("readonly", (s) => s.getAll());

function extOf(name) { const m = /\.([a-z0-9]+)$/i.exec(name); return m ? m[1].toLowerCase() : ""; }
function baseName(name) { return name.replace(/\.[a-z0-9]+$/i, ""); }
function cleanTitle(name) {

  return x || baseName(name);
}

function ago(ts) {

/* =================== ZIP reading (browser's built-in decompressor) =================== */
async function zipEntries(file) {
  const tailLen = Math.min(file.size, 65557);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let eocd = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) return [];
  const cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const out = []; let p = 0; const dec = new TextDecoder();
  while (p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50) {
    const n = cd.getUint16(p + 28, true), x = cd.getUint16(p + 30, true), c = cd.getUint16(p + 32, true);
    out.push({ name: dec.decode(new Uint8Array(cd.buffer, p + 46, n)), method: cd.getUint16(p + 10, true),
               csize: cd.getUint32(p + 20, true), lho: cd.getUint32(p + 42, true) });
    p += 46 + n + x + c;
  }
  return out.filter((e) => !e.name.endsWith("/"));
}
async function zipExtract(file, entry) {
  const lh = new DataView(await file.slice(entry.lho, entry.lho + 30).arrayBuffer());
  const start = entry.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
  const raw = file.slice(start, start + entry.csize);
  if (entry.method === 0) return raw;
  if (entry.method !== 8 || typeof DecompressionStream === "undefined") throw new Error("zip");
  return await new Response(raw.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
}

/* Returns { system, inner, data } or { error }. system may be null when the user must choose. */
async function readRom(file) {
  const ext = extOf(file.name);
  if (EXT[ext]) return { system: EXT[ext], inner: file.name, data: file };
  if (AMBIGUOUS.includes(ext)) return { system: null, inner: file.name, data: file, prefer: AMB[ext], amb: ext };
  if (ext === "zip") {
    try {
      const entries = await zipEntries(file);
      const exts = entries.map((e) => extOf(e.name));
      // CD games made of several files (.cue + .bin…): keep the zip, the emulator opens it itself
      if (exts.some((x) => ["cue", "ccd", "toc", "m3u"].includes(x)) || exts.filter((x) => x === "bin").length > 1) {
        const cue = entries.find((e) => ["cue", "ccd", "toc", "m3u"].includes(extOf(e.name))) || entries[0];
        return { system: null, inner: cue.name.split("/").pop(), data: file, prefer: CD, amb: "cue", whole: "zip" };
      }
      // DOS games: a folder with an .exe/.com/.bat -> the whole zip goes to DOSBox
      if (exts.some((x) => ["exe", "com", "bat"].includes(x)) && entries.length > 1) return { system: "dos", inner: file.name, data: file, whole: "zip" };
      const hit = entries.find((e) => EXT[extOf(e.name)]) || entries.find((e) => AMBIGUOUS.includes(extOf(e.name)));
      // no known ROM inside: arcade romset (sf2.zip, mslug.zip…) -> keep the zip as is
      if (!hit) return { system: null, inner: file.name, data: file, prefer: ["arcade", "mame", "dos"], amb: "zip", whole: "zip" };
      const he = extOf(hit.name);
      return { system: EXT[he] || null, inner: hit.name.split("/").pop(), data: await zipExtract(file, hit), prefer: AMB[he], amb: EXT[he] ? null : he };
    } catch (e) { return { error: t("badZip") }; }
  }
  if (ext === "7z" || ext === "rar") return { error: t("unzip", ext) };
  return { error: t("unknown") };
}

/* =================== Covers (libretro-thumbnails) =================== */
const coverURLs = {};       // id -> object URL for user-picked covers
function coverSrc(g) {
  if (g.coverBlob) { if (!coverURLs[g.id]) coverURLs[g.id] = URL.createObjectURL(g.coverBlob); return coverURLs[g.id]; }
  return g.cover || null;
}
function coverCandidates(g) {
  const sys = SYSTEMS[g.system];
  const fix = (s) => s.replace(/[&*\/:`<>?\\|"]/g, "_");
  const raw = baseName(g.romName || g.title).replace(/^\d{3,5}\s*-\s*/, "").replace(/_/g, " ").trim();
  const title = cleanTitle(g.romName || g.title);
  const names = [raw];
  for (const r of ["(Europe)", "(USA)", "(World)", "(USA, Europe)", "(France)", "(Europe) (En,Fr,De,Es,It)", "(Japan)", "(Germany)", "(Netherlands)"]) names.push(`${title} ${r}`);
  const uniq = [...new Set(names.map(fix))];
  const urls = [];
  for (const sysName of sys.thumbs) for (const n of uniq) {
    urls.push(`https://thumbnails.libretro.com/${encodeURIComponent(sysName)}/Named_Boxarts/${encodeURIComponent(n)}.png`);
  }
  for (const sysName of sys.thumbs.slice(0, 1)) for (const n of uniq.slice(0, 4)) {
    urls.push(`https://raw.githubusercontent.com/libretro-thumbnails/${encodeURIComponent(sysName.replace(/ /g, "_"))}/master/Named_Boxarts/${encodeURIComponent(n)}.png`);
  }
  return urls;
}
function tryImage(url) {
  return new Promise((resolve) => {
    const img = new Image(); const to = setTimeout(() => { img.src = ""; resolve(false); }, 7000);
    img.onload = () => { clearTimeout(to); resolve(img.naturalWidth > 8); };
    img.onerror = () => { clearTimeout(to); resolve(false); };
    img.src = url;
  });
}
/* Full list of box-art names per console (libretro-thumbnails on GitHub), cached for a week */
const THUMB_TTL = 7 * 24 * 3600 * 1000;
const thumbMem = {};
async function thumbIndex(sysName) {
  if (thumbMem[sysName]) return thumbMem[sysName];
  const key = "https://kamei.local/thumbs/" + encodeURIComponent(sysName);
  let cache = null;
  try { cache = await caches.open("kamei-thumbs"); const hit = await cache.match(key); if (hit) { const j = await hit.json(); if (Date.now() - j.t < THUMB_TTL) return (thumbMem[sysName] = j.names); } } catch (e) {}
  const repo = encodeURIComponent(sysName.replace(/ /g, "_"));
  const root = await (await fetch(`https://api.github.com/repos/libretro-thumbnails/${repo}/git/trees/master`)).json();
  const dir = (root.tree || []).find((x) => x.path === "Named_Boxarts");
  if (!dir) return (thumbMem[sysName] = []);
  const tree = await (await fetch(`https://api.github.com/repos/libretro-thumbnails/${repo}/git/trees/${dir.sha}`)).json();
  const names = (tree.tree || []).map((x) => x.path).filter((n) => n.endsWith(".png")).map((n) => n.slice(0, -4));
  try { if (cache && names.length) await cache.put(key, new Response(JSON.stringify({ t: Date.now(), names }))); } catch (e) {}
  return (thumbMem[sysName] = names);
}
const norm = (x) => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[\(\[][^\)\]]*[\)\]]/g, " ")
  .replace(/&/g, " and ").replace(/\bthe\b/g, " ").replace(/[^a-z0-9]+/g, " ").trim();
function similarity(a, b) {
  const A = norm(a).split(" ").filter(Boolean), B = norm(b).split(" ").filter(Boolean);
  if (!A.length || !B.length) return 0;
  const setB = new Set(B); let common = 0;
  for (const w of A) if (setB.has(w)) common++;
  let score = (2 * common) / (A.length + B.length);
  if (norm(a) === norm(b)) score += 0.5;
  return score;
}
function regionBonus(name) {
  const pref = lang === "nl" ? ["Netherlands", "Europe", "Belgium"] : lang === "en" ? ["USA", "World", "Europe"] : ["France", "Europe", "Belgium"];
  for (let i = 0; i < pref.length; i++) if (name.includes(pref[i])) return 0.06 - i * 0.015;
  return 0;
}
async function searchCovers(system, query, limit = 8) {
  const sys = SYSTEMS[system]; const out = [];
  for (const sysName of sys.thumbs) {
    let names = [];
    try { names = await thumbIndex(sysName); } catch (e) {}
    for (const n of names) {
      const sc = similarity(query, n);
      if (sc > 0.34) out.push({ score: sc + regionBonus(n), name: n, url: `https://raw.githubusercontent.com/libretro-thumbnails/${encodeURIComponent(sysName.replace(/ /g, "_"))}/master/Named_Boxarts/${encodeURIComponent(n)}.png` });
    }
    if (out.some((x) => x.score > 1.2)) break;
  }
  return out.sort((a, b) => b.score - a.score).slice(0, limit);
}
async function findCover(g) {
  // 1) exact names (fast)
  for (const url of coverCandidates(g).slice(0, 6)) if (await tryImage(url)) return url;
  // 2) closest title in the full list
  try {
    const best = (await searchCovers(g.system, cleanTitle(g.romName || g.title), 3)).find((c) => c.score >= 0.75);
    if (best && await tryImage(best.url)) return best.url;
  } catch (e) {}
  return null;
}

    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 10, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);

}

    if (s && s.shot) { const u = URL.createObjectURL(s.shot); slotURLs.push(u); img = `style="background-image:url('${u}')"`; }
    const name = slot === "auto" ? t("slotAuto") : t("slot", slot);
    return `<div class="slot"><div class="thumb" ${img}>${s && s.shot ? "" : "▢"}</div>
      <div class="info"><b>${name}</b><span>${s ? ago(s.time) : t("emptySlot")}</span></div>
      <div class="acts">${slot === "auto" ? "" : `<button class="ok" data-save="${slot}">${t("save")}</button>`}
        <button data-load="${slot}" ${s ? "" : "disabled"}>${t("load")}</button></div></div>`;
  };
  openSheet(`<h3>${t("savesTitle")}</h3><p class="hint">${t("savesHint")}</p>${["1", "2", "3", "auto"].map(row).join("")}`);
  $("sheet").querySelectorAll("[data-save]").forEach((b) => b.onclick = () => { b.disabled = true; frameWin().postMessage({ type: "saveSlot", slot: b.dataset.save }, "*"); });
  $("sheet").querySelectorAll("[data-load]").forEach((b) => b.onclick = () => { b.disabled = true; frameWin().postMessage({ type: "loadSlot", slot: b.dataset.load }, "*"); });
}

/* =================== Hooks used by the Android app =================== */
window.kameiBack = () => {
  if ($("sheetBg").classList.contains("on")) { closeSheet(); return "stay"; }
  if ($("player").classList.contains("on")) { $("quit").click(); return "stay"; }
  return "exit";
};
window.kameiPause = () => { try { if (current) frameWin().postMessage({ type: "save" }, "*"); } catch (e) {} };
let padToastShown = false;
function padNotice() { if (!padToastShown) { padToastShown = true; toast(t("padOn")); } }
window.kameiKey = (code, down) => {
  padNotice();
  if (current && !$("sheetBg").classList.contains("on")) { frameWin().postMessage({ type: "key", code, down }, "*"); return; }
  // Basic navigation in the library with a controller: A opens the first game of the list
  if (!current && down && (code === 96 || code === 108)) { const first = document.querySelector("[data-play]"); if (first) first.click(); }
};
window.kameiAxis = (...v) => { padNotice(); if (current) frameWin().postMessage({ type: "axis", v }, "*"); };

window.kameiReload = load;
$("catBtn").onclick = () => window.kameiCatalogue && window.kameiCatalogue.open();
applyLang();
load().then(scrapeMissing);
window.addEventListener("online", scrapeMissing);
</script>
