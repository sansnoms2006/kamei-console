<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamei Events — OBS</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root { --acc: #9BD14B; --air: #e11d48; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: #fff; font: 600 1.6vw Inter, system-ui, sans-serif; }
  .logo { font-family: "Press Start 2P", monospace; letter-spacing: .1em; } .logo i { color: var(--acc); font-style: normal; }
  #stage { position: absolute; inset: 0; display: grid; background: #000; }
  #stage:empty { display: none; }
  #stage.two { grid-template-columns: 1fr 1fr; gap: .4vw; }
  .cam { position: relative; overflow: hidden; background: #000; }
  .cam video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .lt { position: absolute; left: 2.2vw; bottom: 2.4vw; display: flex; align-items: center; gap: 1vw; padding: .7vw 1vw .7vw .7vw; border-radius: 1vw;
        background: linear-gradient(90deg, rgba(10,12,16,.92), rgba(10,12,16,.78)); border-left: .45vw solid var(--acc); box-shadow: 0 .6vw 2vw rgba(0,0,0,.5); }
  #stage.two .lt { font-size: 1.25vw; left: 1.2vw; bottom: 1.4vw; }
  .lt .av { width: 3.4vw; height: 3.4vw; border-radius: 50%; overflow: hidden; display: grid; flex: none; }
  .lt .av img, .lt .av span { width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; font-weight: 900; color: #0b0b12; font-size: 1.6vw; }
  .who b { display: block; font-size: 1.9vw; font-weight: 900; } .who small { display: block; font-size: 1vw; color: #b9c0cc; font-weight: 600; }
  .clk { display: flex; align-items: center; gap: .8vw; margin-left: 1.2vw; padding-left: 1.2vw; border-left: 1px solid rgba(255,255,255,.2); }
  .clk i { font: 800 2.2vw ui-monospace, Menlo, Consolas, monospace; font-style: normal; font-variant-numeric: tabular-nums; }
  .clk u { text-decoration: none; font-size: 2vw; font-weight: 900; }
  #standby { position: absolute; inset: 0; display: grid; place-items: center; }
  .sb { min-width: 34vw; padding: 2.4vw; border-radius: 1.4vw; background: rgba(10,12,16,.88); text-align: center; border: 2px solid var(--acc); }
  .sb .logo { font-size: 1.2vw; } .sb h1 { margin: 1vw 0 .3vw; font-size: 3vw; } .sb p { margin: 0 0 1.2vw; color: #b9c0cc; }
  .sb .rr { display: flex; gap: 1vw; padding: .5vw 0; border-top: 1px solid rgba(255,255,255,.1); text-align: left; } .sb .rr span { flex: 1; } .sb .rr i { font: 800 1.6vw ui-monospace, monospace; font-style: normal; }
</style>
</head>
<body data-mode="obs">
<script src="lib/supabase.js"></script>
<script src="regie.js"></script>
</body>
</html>
