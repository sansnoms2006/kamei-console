<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jeu</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b12; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #rew { position: fixed; left: 10px; top: 10px; z-index: 30; width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3);
         background: rgba(20,20,30,.55); color: #fff; font-size: 20px; display: none; place-items: center; touch-action: none; }
  #rew.on { background: #8fc63f; }
  body.lcd #game canvas { filter: contrast(1.05) saturate(.9); }
  body.lcd #game::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; color: #8b8ba7;
          font: 600 14px/1.4 system-ui, sans-serif; }
</style>
<script>
/* Keep track of every AudioContext so sound can be (re)started on the first touch:
   some Android WebViews create them "suspended", which gives a game without sound. */
(function () {
  const all = [];
  const Orig = window.AudioContext || window.webkitAudioContext;
  if (Orig) {
    const Wrapped = function (...args) { const c = new Orig(...args); all.push(c); return c; };
    Wrapped.prototype = Orig.prototype;
    window.AudioContext = Wrapped;
    window.webkitAudioContext = Wrapped;
  }
  /* "Jouer ensemble": remember what is plugged into the speakers, so it can also be sent to the friend */
  const toSpeakers = new Set(); let tee = null;
  const origConnect = AudioNode.prototype.connect;
  AudioNode.prototype.connect = function (dest, ...rest) {
    const r = origConnect.call(this, dest, ...rest);
    try {
      if (dest === this.context.destination) {
        toSpeakers.add(this);
        if (tee && tee.context === this.context) origConnect.call(this, tee);
      }
    } catch (e) {}
    return r;
  };
  window.kameiAudioStream = () => {
    const node = [...toSpeakers][0]; if (!node) return null;
    if (!tee) { tee = node.context.createMediaStreamDestination(); for (const n of toSpeakers) { try { if (n.context === tee.context) origConnect.call(n, tee); } catch (e) {} } }
    return tee.stream;
  };
  window.kameiResumeAudio = () => { for (const c of all) { try { if (c.state !== "running") c.resume(); } catch (e) {} } };
  for (const ev of ["touchstart", "touchend", "pointerdown", "keydown", "click"]) {
    window.addEventListener(ev, window.kameiResumeAudio, true);
  }
})();
</script>
</head>
<body>
<div id="game"></div>
<div id="wait">…</div>
<script>
(function () {
  let started = false;
  let meta = null;

  /* ---------- Save slots (stored on the device, in IndexedDB) ---------- */
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open("kamei-states", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("states");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function idb(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction("states", mode); const req = fn(t.objectStore("states"));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  }
  const key = (slot) => meta.saveKey + "|" + meta.system + "|" + slot;
  const emu = () => window.EJS_emulator;
  const ready = () => emu() && emu().started && emu().gameManager;

  async function saveSlot(slot) {
    if (!ready()) return false;
    const gm = emu().gameManager;
    const state = gm.getState().slice();
    let shot = null;
    try { shot = await Promise.race([gm.screenshot(), new Promise((r) => setTimeout(() => r(null), 1500))]); } catch (e) {}
    await idb("readwrite", (s) => s.put({ time: Date.now(), state, shot: shot ? new Blob([shot], { type: "image/png" }) : null }, key(slot)));
    return true;
  }
  async function loadSlot(slot) {
    if (!ready()) return false;
    const rec = await idb("readonly", (s) => s.get(key(slot)));
    if (!rec) return false;
    emu().gameManager.loadState(rec.state);
    if (emu().paused) emu().togglePlaying && emu().togglePlaying();
    return true;
  }
  async function listSlots() {
    const out = {};
    for (const slot of ["auto", "1", "2", "3"]) {
      const rec = await idb("readonly", (s) => s.get(key(slot)));
      out[slot] = rec ? { time: rec.time, shot: rec.shot } : null;
    }
    return out;
  }

  /* ---------- DS: turn finger touches into mouse input for the bottom screen ---------- */
  function setupTouchToMouse() {
    const canvas = emu() && emu().canvas;
    if (!canvas) return setTimeout(setupTouchToMouse, 300);
    let id = null;
    const send = (type, t) => canvas.dispatchEvent(new MouseEvent(type, {
      bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY, button: 0, buttons: type === "mouseup" ? 0 : 1 }));
    canvas.addEventListener("touchstart", (e) => {
      if (id !== null) return;
      const t = e.changedTouches[0]; id = t.identifier;
      send("mousemove", t); send("mousedown", t); e.preventDefault();
    }, { passive: false });
    canvas.addEventListener("touchmove", (e) => {
      for (const t of e.changedTouches) if (t.identifier === id) { send("mousemove", t); e.preventDefault(); }
    }, { passive: false });
    const end = (e) => {
      for (const t of e.changedTouches) if (t.identifier === id) { send("mouseup", t); id = null; e.preventDefault(); }
    };
    canvas.addEventListener("touchend", end, { passive: false });
    canvas.addEventListener("touchcancel", end, { passive: false });
  }

  /* ---------- Physical controllers forwarded by the Android app ---------- */
  // Android key codes -> RetroPad inputs (0 B, 1 Y, 2 Select, 3 Start, 4 Up, 5 Down, 6 Left, 7 Right, 8 A, 9 X, 10 L, 11 R, 12 L2, 13 R2, 14 L3, 15 R3)
  const KEYMAP = { 96: 0, 97: 8, 99: 1, 100: 9, 102: 10, 103: 11, 104: 12, 105: 13, 106: 14, 107: 15, 108: 3, 109: 2,
                   19: 4, 20: 5, 21: 6, 22: 7, 23: 0, 66: 3, 62: 2, 188: 0, 189: 8, 190: 1, 191: 9, 192: 10, 193: 11, 196: 3, 197: 2 };
  const held = {};
  /* ---------- Touch controls: shown on touch screens, hidden while a real controller is used ---------- */
  // EmulatorJS only shows them when its start button was touched by a finger; we start automatically, so we decide here.
  const touchCapable = (navigator.maxTouchPoints || 0) > 0 || "ontouchstart" in window;
  let padActive = false;                 // a physical controller is being used
  const anyGamepad = () => { try { return Array.from(navigator.getGamepads ? navigator.getGamepads() : []).some((g) => g && g.connected); } catch (e) { return false; } };
  function wantPad() {
    if (!touchCapable) return false;
    let set; try { set = emu().getSettingValue("virtual-gamepad"); } catch (e) {}
    if (set === "disabled") return false;
    return !(padActive || anyGamepad());
  }
  let shownPad = null;
  function syncPad() {
    if (!ready()) return;
    const want = wantPad();
    try { if (touchCapable) emu().touch = true; emu().toggleVirtualGamepad && emu().toggleVirtualGamepad(want); } catch (e) {}
    if (shownPad !== null && shownPad !== want) parent.postMessage({ type: "pad", controller: !want }, "*");
    shownPad = want;
  }
  function padSeen() { if (!padActive) { padActive = true; syncPad(); } }
  window.addEventListener("gamepadconnected", () => setTimeout(syncPad, 50));
  window.addEventListener("gamepaddisconnected", () => setTimeout(() => { if (!anyGamepad()) { padActive = false; syncPad(); } }, 50));
  // touching the screen again (outside the buttons) brings the touch controls back
  document.addEventListener("touchstart", (e) => {
    if (!padActive && !anyGamepad()) return;
    if (e.target.closest && e.target.closest(".ejs_menu_bar, .ejs_popup_container, #rew")) return;
    padActive = false;
    if (anyGamepad()) return;
    syncPad();
  }, { passive: true });
  window.kameiKey = (code, down) => {
    const idx = KEYMAP[code];
    if (idx === undefined || !ready()) return;
    if (down) padSeen();
    emu().gameManager.simulateInput(0, idx, down ? 1 : 0);
  };
  function setBtn(idx, on) {
    if (!!held[idx] === on) return;
    held[idx] = on; emu().gameManager.simulateInput(0, idx, on ? 1 : 0);
  }
  window.kameiAxis = (x, y, hx, hy, lt, rt) => {
    if (!ready()) return;
    if ([x, y, hx, hy].some((v) => Math.abs(v) > 0.4) || lt > 0.5 || rt > 0.5) padSeen();
    const gm = emu().gameManager, A = 0x7fff;
    // left stick: analog (16 right, 17 left, 18 down, 19 up) + d-pad emulation for 2D games
    gm.simulateInput(0, 16, x > 0 ? Math.round(x * A) : 0); gm.simulateInput(0, 17, x < 0 ? Math.round(-x * A) : 0);
    gm.simulateInput(0, 18, y > 0 ? Math.round(y * A) : 0); gm.simulateInput(0, 19, y < 0 ? Math.round(-y * A) : 0);
    const analog = ["n64", "psx"].includes(meta.system);
    setBtn(4, hy < -0.5 || (!analog && y < -0.5)); setBtn(5, hy > 0.5 || (!analog && y > 0.5));
    setBtn(6, hx < -0.5 || (!analog && x < -0.5)); setBtn(7, hx > 0.5 || (!analog && x > 0.5));
    setBtn(12, lt > 0.5); setBtn(13, rt > 0.5);
  };

  /* ---------- Jouer ensemble / regarder en direct (host): picture + sound to each friend; player 2's buttons from the "input" peer ---------- */
  const peers = {};   // id -> { pc, dc, input }
  let p2 = 0, p2axis = [0, 0];
  const sig = (peer, data) => parent.postMessage({ type: "netSig", peer, data }, "*");
  function releaseP2() { if (ready()) for (let i = 0; i < 20; i++) { try { emu().gameManager.simulateInput(1, i, 0); } catch (e) {} } p2 = 0; p2axis = [0, 0]; }
  function netStop(peer) {
    for (const id of Object.keys(peers)) {
      if (peer && id !== peer) continue;
      const x = peers[id]; delete peers[id];
      try { x.dc && x.dc.close(); } catch (e) {} try { x.pc.close(); } catch (e) {}
      if (x.input) releaseP2();
    }
  }
  function applyP2(m) {
    if (!ready()) return;
    const gm = emu().gameManager;
    const b = m.b | 0;
    for (let i = 0; i < 16; i++) { const on = (b >> i) & 1; if (((p2 >> i) & 1) !== on) gm.simulateInput(1, i, on); }
    p2 = b;
    const [x, y] = m.a || [0, 0], A = 0x7fff;
    if (x !== p2axis[0] || y !== p2axis[1]) {
      gm.simulateInput(1, 16, x > 0 ? Math.round(x * A) : 0); gm.simulateInput(1, 17, x < 0 ? Math.round(-x * A) : 0);
      gm.simulateInput(1, 18, y > 0 ? Math.round(y * A) : 0); gm.simulateInput(1, 19, y < 0 ? Math.round(-y * A) : 0);
      p2axis = [x, y];
    }
  }
  let camStream = null;
  function gameStream() {
    if (camStream && camStream.getVideoTracks()[0] && camStream.getVideoTracks()[0].readyState === "live") return camStream;
    const canvas = document.querySelector("#game canvas");
    if (!canvas || !canvas.captureStream) return null;
    camStream = canvas.captureStream(60);
    try { camStream.getVideoTracks()[0].contentHint = "motion"; } catch (e) {}
    return camStream;
  }
  async function netHost(ice, peer, input) {
    peer = peer || "p2";
    netStop(peer);
    const cs = gameStream();
    if (!cs) { parent.postMessage({ type: "netState", peer, state: "error" }, "*"); return; }
    const pc = new RTCPeerConnection({ iceServers: ice });
    const x = peers[peer] = { pc, dc: null, input: !!input };
    const vs = pc.addTrack(cs.getVideoTracks()[0], cs);
    const audio = window.kameiAudioStream && window.kameiAudioStream();
    if (audio && audio.getAudioTracks()[0]) pc.addTrack(audio.getAudioTracks()[0], audio);
    x.dc = pc.createDataChannel("p2", { ordered: false, maxRetransmits: 0 });
    if (x.input) x.dc.onmessage = (e) => { try { applyP2(JSON.parse(e.data)); } catch (err) {} };
    pc.onicecandidate = (e) => { if (e.candidate) sig(peer, { kind: "ice", data: e.candidate.toJSON() }); };
    pc.onconnectionstatechange = () => {
      parent.postMessage({ type: "netState", peer, state: pc.connectionState }, "*");
      if (pc.connectionState === "connected") {
        try { const prm = vs.getParameters(); prm.encodings = prm.encodings && prm.encodings.length ? prm.encodings : [{}];
              prm.encodings[0].maxBitrate = x.input ? 3500000 : 2000000; prm.encodings[0].maxFramerate = 60; prm.degradationPreference = "maintain-framerate"; vs.setParameters(prm); } catch (e) {}
      }
      if (pc.connectionState === "failed" || pc.connectionState === "closed") { if (peers[peer] === x) netStop(peer); }
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sig(peer, { kind: "offer", data: pc.localDescription.toJSON() });
  }
  async function netSig(peer, m) {
    const x = peers[peer || "p2"]; if (!x) return;
    try {
      if (m.kind === "answer") await x.pc.setRemoteDescription(m.data);
      if (m.kind === "ice" && m.data) await x.pc.addIceCandidate(m.data);
    } catch (e) {}
  }

  /* ---------- Game options: filter, touch controls, cheats, rewind, screenshot ---------- */
  let opts = {};
  function applyOpts(o) {
    opts = Object.assign(opts, o || {});
    if (!ready()) return;
    try { emu().enableShader(opts.shader && opts.shader !== "lcd" ? opts.shader : "disabled"); } catch (e) {}
    document.body.classList.toggle("lcd", opts.shader === "lcd");
    const pad = opts.pad || {}, sz = pad.size || 1, op = pad.opacity == null ? 1 : pad.opacity, lift = pad.lift || 0;
    let st = document.getElementById("padStyle");
    if (!st) { st = document.createElement("style"); st.id = "padStyle"; document.head.appendChild(st); }
    st.textContent = `.ejs_virtualGamepad_left { transform: translateY(${-lift}px) scale(${sz}); transform-origin: bottom left; opacity: ${op}; }
      .ejs_virtualGamepad_right { transform: translateY(${-lift}px) scale(${sz}); transform-origin: bottom right; opacity: ${op}; }
      .ejs_virtualGamepad_top, .ejs_virtualGamepad_bottom { opacity: ${op}; }`;
    if (opts.cheats) {
      try { const gm = emu().gameManager; gm.resetCheat(); opts.cheats.forEach((c, i) => { if (c.on && c.code) gm.setCheat(i, 1, c.code); }); } catch (e) {}
    }
    document.getElementById("rew").style.display = opts.rewind ? "grid" : "none";
  }
  const rew = document.createElement("button"); rew.id = "rew"; rew.textContent = "⏪";
  document.body.appendChild(rew);
  const rewOn = (on) => { try { if (ready()) emu().gameManager.simulateInput(0, 28, on ? 1 : 0); } catch (e) {} rew.classList.toggle("on", on); };
  rew.addEventListener("pointerdown", (e) => { e.preventDefault(); rew.setPointerCapture(e.pointerId); rewOn(true); });
  rew.addEventListener("pointerup", () => rewOn(false)); rew.addEventListener("pointercancel", () => rewOn(false));
  window.addEventListener("keydown", (e) => { if (e.code === "Backspace" && opts.rewind) { e.preventDefault(); rewOn(true); } });
  window.addEventListener("keyup", (e) => { if (e.code === "Backspace" && opts.rewind) rewOn(false); });
  async function shot() {
    try { const png = await emu().gameManager.screenshot(); parent.postMessage({ type: "shot", png }, "*"); }
    catch (e) { parent.postMessage({ type: "shot", png: null }, "*"); }
  }

  /* ---------- Start ---------- */
  function startGame(msg) {
    if (started) return;
    started = true; meta = msg;
    document.getElementById("wait").remove();
    window.EJS_player = "#game";
    window.EJS_core = msg.system;
    window.EJS_gameUrl = msg.blob;
    window.EJS_gameName = msg.saveKey;
    window.EJS_pathtodata = "data/";
    window.EJS_DEBUG_XX = true;
    window.EJS_language = msg.lang || "fr-FR";
    window.EJS_color = msg.color || "#8fc63f";
    window.EJS_startOnLoaded = true;
    window.EJS_backgroundColor = "#0b0b12";
    window.EJS_threads = !!msg.threads && typeof SharedArrayBuffer === "function";
    if (msg.ext) window.EJS_kameiExt = msg.ext;
    if (msg.bios) window.EJS_biosUrl = msg.bios;
    window.EJS_volume = 1;
    window.EJS_defaultOptions = { "save-save-interval": "30", "melonds_touch_mode": "Touch" };
    if (msg.opts && msg.opts.rewind) { window.EJS_defaultOptions.rewindEnabled = "enabled"; window.EJS_defaultOptions["rewind-granularity"] = "6"; }
    opts = msg.opts || {};
    window.EJS_Buttons = { netplay: false, exitEmulation: false, cacheManager: false, contextMenu: false, saveState: false, loadState: false };
    const s = document.createElement("script");
    s.src = "data/loader.js";
    document.body.appendChild(s);
    if (msg.system === "nds") setupTouchToMouse();
    if (msg.vibe) setupVibe();
    const iv = setInterval(() => { if (ready()) { clearInterval(iv); applyOpts(); syncPad(); setTimeout(syncPad, 600); setTimeout(syncPad, 2000); parent.postMessage({ type: "started" }, "*");
      if (msg.resume) setTimeout(() => { loadSlot(msg.resume === true ? "auto" : String(msg.resume)).then((ok) => parent.postMessage({ type: "resumed", ok }, "*"), () => {}); }, 700); } }, 400);
  }

  /* Short vibration when a virtual (touch) button is pressed */
  function setupVibe() {
    const buzz = () => {
      try { const n = window.KameiNative || (parent && parent.KameiNative); if (n && n.vibrate) { n.vibrate(16); return; } } catch (e) {}
      try { navigator.vibrate && navigator.vibrate(16); } catch (e) {}
    };
    document.addEventListener("touchstart", (e) => {
      for (const tch of e.changedTouches) {
        const el = tch.target && tch.target.closest && tch.target.closest(".ejs_virtualGamepad_button, .ejs_dpad_main, .ejs_virtualGamepad_left > *, .ejs_virtualGamepad_right > *");
        if (el) { buzz(); break; }
      }
    }, { passive: true, capture: true });
  }

  function saveBattery() {
    try { if (ready()) emu().gameManager.saveSaveFiles(); } catch (e) {}
  }

  window.addEventListener("message", async (e) => {
    if (e.source !== parent || !e.data) return;
    const d = e.data;
    if (d.type === "load") startGame(d);
    if (d.type === "save") saveBattery();
    if (d.type === "quit") {
      saveBattery();
      try { await saveSlot("auto"); } catch (err) {}
      setTimeout(() => parent.postMessage({ type: "saved" }, "*"), 600);
    }
    if (d.type === "slots") parent.postMessage({ type: "slots", slots: await listSlots().catch(() => ({})) }, "*");
    if (d.type === "saveSlot") {
      let ok = false; try { ok = await saveSlot(d.slot); } catch (err) {}
      parent.postMessage({ type: "slotDone", action: "save", ok, slot: d.slot }, "*");
    }
    if (d.type === "loadSlot") {
      let ok = false; try { ok = await loadSlot(d.slot); } catch (err) {}
      parent.postMessage({ type: "slotDone", action: "load", ok, slot: d.slot }, "*");
    }
    if (d.type === "key") window.kameiKey(d.code, d.down);
    if (d.type === "axis") window.kameiAxis(...d.v);
    if (d.type === "netHost") netHost(d.ice || [], d.peer, d.input);
    if (d.type === "netSig") netSig(d.peer, d.data);
    if (d.type === "netStop") netStop(d.peer);
    if (d.type === "opts") applyOpts(d.opts);
    if (d.type === "shot") shot();
  });
  parent.postMessage({ type: "ready" }, "*");
})();
</script>
</body>
</html>
