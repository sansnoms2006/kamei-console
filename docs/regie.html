<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamei — Régie</title>
<link rel="icon" type="image/png" href="icons/default-192.png">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root { --bg: #0d0f13; --panel: #161a20; --line: #262b33; --text: #eef1f5; --muted: #8b93a1; --acc: #9BD14B; --air: #e11d48; --pv: #f5b301; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 14px Inter, system-ui, sans-serif; }
  .logo { font-family: "Press Start 2P", monospace; font-size: 12px; letter-spacing: 1px; white-space: nowrap; } .logo i { color: var(--acc); font-style: normal; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #11141a; flex-wrap: wrap; }
  #evName { color: var(--muted); font-weight: 700; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srch { flex: 1; min-width: 240px; }
  .srch input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #0a0c10; color: var(--text); font: 600 15px Inter, sans-serif; }
  .srch input:focus { outline: none; border-color: var(--air); }
  .srch input.bad { border-color: #f59e0b; animation: shake .3s; } @keyframes shake { 50% { transform: translateX(6px); } }
  button { cursor: pointer; border: 1px solid var(--line); background: #1d222a; color: var(--text); border-radius: 10px; padding: 8px 12px; font: 700 13px Inter, sans-serif; }
  button:hover { border-color: #3a414c; }
  button.go { background: var(--acc); color: #0b0b12; border: 0; }
  .chips { display: flex; gap: 4px; } .chips button.on { background: var(--text); color: #0b0b12; }
  .tg { display: flex; gap: 6px; align-items: center; color: var(--muted); font-weight: 700; user-select: none; }
  .selc { color: var(--pv); font-weight: 800; } .selc button { padding: 4px 8px; margin-left: 4px; }
  main { display: grid; grid-template-columns: 1fr 440px; gap: 12px; padding: 12px; height: calc(100% - 64px); }
  #mos { display: flex; flex-direction: column; min-height: 0; }
  #tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-content: start; overflow: auto; }
  .tile { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; border: 3px solid transparent; cursor: pointer; user-select: none; }
  .tile video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .tile .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; pointer-events: none; }
  .tile.vid .ph { display: none; }
  .tile.off { opacity: .55; }
  .tile.pv { border-color: var(--pv); } .tile.air { border-color: var(--air); box-shadow: 0 0 0 2px var(--air), 0 0 18px rgba(225,29,72,.5); }
  .tile.sel::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--pv); color: #000; display: grid; place-items: center; font-weight: 900; }
  .tile kbd { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.7); border: 1px solid #555; border-radius: 6px; padding: 1px 6px; font: 700 11px ui-monospace, monospace; }
  .tile .onair { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); background: var(--air); color: #fff; font: 900 10px Inter, sans-serif; letter-spacing: 1px; padding: 3px 8px; border-radius: 5px; font-style: normal; }
  .tile .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 18px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.85)); font-size: 12.5px; }
  .tile .bar b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .bar .tm { margin-left: auto; font: 800 12.5px ui-monospace, Menlo, monospace; font-style: normal; font-variant-numeric: tabular-nums; }
  .tile .bar u { text-decoration: none; font-weight: 900; }
  .av { width: 22px; height: 22px; flex: none; border-radius: 50%; overflow: hidden; display: inline-grid; }
  .av img, .av span { width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; font-weight: 900; font-size: 11px; color: #0b0b12; }
  .pager { display: flex; align-items: center; gap: 8px; padding-top: 10px; color: var(--muted); } .pager small { margin-left: auto; }
  aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .mon { background: #000; border-radius: 12px; overflow: hidden; border: 3px solid var(--pv); }
  .mon.air { border-color: var(--air); }
  .mon .lab { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #15181e; font: 900 12px Inter, sans-serif; letter-spacing: .8px; }
  .mon.air .lab { background: var(--air); }
  .mon .lab span { font-weight: 700; letter-spacing: 0; opacity: .9; } .mon .lab button { margin-left: auto; padding: 2px 8px; }
  .mon video { width: 100%; aspect-ratio: 16 / 9; display: block; object-fit: contain; background: #000; }
  .airv { display: grid; } .airv.two { grid-template-columns: 1fr 1fr; } .airv:empty { aspect-ratio: 16 / 9; }
  aside h3 { margin: 4px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; }
  #rank { overflow: auto; flex: 1; }
  .rr { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; background: var(--panel); margin-bottom: 5px; cursor: pointer; }
  .rr b { width: 26px; text-align: center; } .rr span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rr i { font: 800 13px ui-monospace, Menlo, monospace; font-style: normal; }
  .rr.dim { opacity: .55; }
  .empty { color: var(--muted); grid-column: 1 / -1; padding: 40px; text-align: center; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 9; } #modal.on { display: grid; }
  .mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: min(560px, 92vw); display: grid; gap: 10px; }
  .mbox p { color: var(--muted); margin: 0; } .mbox input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0a0c10; color: var(--text); } .mbox div { display: flex; gap: 8px; }
  .rtoast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--acc); color: #0b0b12; font-weight: 800; padding: 12px 18px; border-radius: 12px; z-index: 10; }
  .pick { max-width: 560px; margin: 60px auto; display: grid; gap: 12px; padding: 0 16px; }
  .pick a { display: block; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 700; }
  .pick a small { display: block; color: var(--muted); font-weight: 500; margin-top: 4px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } #tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body data-mode="regie">
<p style="padding:20px;color:#8b93a1">…</p>
<script src="lib/supabase.js"></script>
<script src="regie.js"></script>
</body>
</html>
